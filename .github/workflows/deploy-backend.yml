name: Deploy FastAPI Backend

on:
  push:
    branches:
      - sahil
  workflow_dispatch:  # Allow manual trigger

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east1
  SERVICE_NAME: aurelia-api
  IMAGE_NAME: us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/aurelia-docker-repo/fastapi-service
jobs:
  deploy:
    name: Build and Deploy FastAPI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker us-east1-docker.pkg.dev
      
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ./app
      
      - name: Push Docker image to GCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --service-account aurelia-fastapi-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},PINECONE_INDEX_NAME=fintbx-hybrid-3072,DB_HOST=${{ secrets.DB_HOST }},DB_USER=aurelia_user,DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_NAME=aurelia_db" \
            --add-cloudsql-instances=${{ secrets.DB_CONNECTION_NAME }}
      
      - name: Get Service URL
        id: get-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "SERVICE_URL=$URL" >> $GITHUB_OUTPUT
          echo "FastAPI deployed to: $URL"
      - name: Update Cloud Composer Environment Variable
        run: |
          gcloud composer environments update aurelia-airflow \
          --location us-east1 \
          --update-env-variables FASTAPI_URL=${{ steps.get-url.outputs.SERVICE_URL }}
          echo "✅ Updated FASTAPI_URL in Cloud Composer to: ${{ steps.get-url.outputs.SERVICE_URL }}"    
      
      - name: Test Health Endpoint
        run: |
          sleep 10  # Wait for service to be ready
          curl -f ${{ steps.get-url.outputs.SERVICE_URL }}/health || exit 1
          echo "✅ Health check passed!"
      
      - name: Comment PR with URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 FastAPI Backend deployed!\n\nURL: ${{ steps.get-url.outputs.SERVICE_URL }}'
            })
