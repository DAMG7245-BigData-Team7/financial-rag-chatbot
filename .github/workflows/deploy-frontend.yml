name: Deploy Streamlit Frontend

on:
  push:
    branches:
      - sahil
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east1
  SERVICE_NAME: aurelia-frontend
  IMAGE_NAME: us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/aurelia-docker-repo/streamlit-service
  BACKEND_SERVICE: aurelia-api

jobs:
  deploy:
    name: Build and Deploy Streamlit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Get Backend URL
        id: get-backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)' || echo "")
          
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠️ Backend not deployed yet, using placeholder"
            BACKEND_URL="http://localhost:8000"
          fi
          
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "Backend URL: $BACKEND_URL"
      
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker us-east1-docker.pkg.dev
      
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ./frontend
      
      - name: Push Docker image to GCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --service-account aurelia-streamlit-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --update-secrets="FASTAPI_URL=${{ steps.get-backend-url.outputs.BACKEND_URL }}"
      
      - name: Get Service URL
        id: get-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "SERVICE_URL=$URL" >> $GITHUB_OUTPUT
          echo "Streamlit deployed to: $URL"
      
      - name: Test Frontend
        run: |
          sleep 10
          curl -f ${{ steps.get-url.outputs.SERVICE_URL }} || exit 1
          echo "✅ Frontend is live!"
